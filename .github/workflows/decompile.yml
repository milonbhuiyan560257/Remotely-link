name: APK Decompiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile-job:
    runs-on: ubuntu-latest

    env:
      APK_PATH: my_app.apk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O apktool.jar

          echo '#!/bin/sh' > apktool
          echo 'exec java -jar "$GITHUB_WORKSPACE/apktool.jar" "$@"' >> apktool
          chmod +x apktool

          sudo mv apktool /usr/local/bin/apktool

      - name: Check APK
        run: |
          echo "APK: $APK_PATH"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found!"
            ls -lah
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Validate APK
        run: |
          python - <<'PY'
          import os
          import zipfile

          apk = os.environ["APK_PATH"]

          print("File:", apk)
          print("File size:", os.path.getsize(apk), "bytes")

          if not zipfile.is_zipfile(apk):
              raise SystemExit(
                  "ERROR: my_app.apk is not a valid ZIP/APK file."
              )

          print("OK: APK ZIP structure is valid.")
          PY

      - name: Decompile APK
        run: |
          APK_NAME="$(basename "$APK_PATH" .apk)"
          OUTPUT_DIR="decompiled_${APK_NAME}"

          rm -rf "$OUTPUT_DIR"

          echo "APK: $APK_PATH"
          echo "Output: $OUTPUT_DIR"

          apktool d "$APK_PATH" \
            -o "$OUTPUT_DIR" \
            -f

      - name: Show Decompiled Files
        run: |
          echo "Decompiled output:"
          find decompiled_* -maxdepth 3 -type f | sort | head -200

      - name: Upload Decompiled Files
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-apk-files
          path: decompiled_*/
          if-no-files-found: error
