

name: APK Decompiler

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "APK file path"
        required: true
        default: "my_app.apk"
        type: string

permissions:
  contents: read

jobs:
  decompile-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Check APK
        env:
          APK_PATH: ${{ inputs.apk_path }}
        run: |
          echo "Checking APK..."
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found: $APK_PATH"
            exit 1
          fi
          echo "APK found:"
          ls -lh "$APK_PATH"

      - name: Decompile APK
        env:
          APK_PATH: ${{ inputs.apk_path }}
        run: |
          python main.py "$APK_PATH"

      - name: Show Decompiled Files
        run: |
          echo "Decompiled output:"
          find decompiled_* -maxdepth 3 -type f | sort

      - name: Upload Decompiled Files
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-apk-files
          path: decompiled_*/
          if-no-files-found: error

